mode: ContinuousDelivery
# Base version. GitVersion starts from the newest reachable version tag (today
# 0.4.6 on origin, written without a leading v; the default tag prefix makes
# the v optional). Without the old ordinary-word patterns that base would give
# 0.4.7-preview... under the already released stable 0.4.7, so next-version
# lifts the first preview to 0.4.8-preview0001. next-version is a base number
# only and never removes the preview label on main. After a v0.4.8-previewNNNN
# tag exists the preview counter continues from that tag (preview0002, ...).
# After a stable v0.4.8 tag the base is that tag, and the next build counts
# from 0.4.9.
# tests/QA/module.tests.ps1 holds the built version in [0.4.8, 1.0.0).
#
# Only explicit tokens move the version: a +semver: token in a commit message
# (breaking or major, feature or minor, fix or patch, none or skip), or a
# conventional subject of the form type!: for a major step. Ordinary words
# never bump the version.
# GitVersion reads every reachable commit message, and a squash merge copies the
# PR title and body into main. So never quote a token in a commit message, PR
# title or PR body; name it in words instead. File content is never read.
next-version: 0.4.8
major-version-bump-message: '(\+semver:\s?(breaking|major))|(^[a-z]+(\(.+\))?!:)'
minor-version-bump-message: '\+semver:\s?(feature|minor)'
patch-version-bump-message: '\+semver:\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'
assembly-informational-format: '{NuGetVersionV2}+Sha.{Sha}.Date.{CommitDate}'
branches:
  master:
    tag: preview
    regex: ^main$
  pull-request:
    tag: PR
  # Anchored, so a word inside a branch name ("off-the", "prefix-") never selects a config.
  feature:
    tag: useBranchName
    increment: Minor
    regex: ^feat(ure)?s?[\/-]
    source-branches: ['master']
  hotfix:
    tag: fix
    increment: Patch
    regex: ^(hot)?fix(es)?[\/-]
    source-branches: ['master']

ignore:
  sha: []
merge-message-formats: {}
